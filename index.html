<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sculpt">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png">
<title>Sculpt</title>
<style>
:root{
  --ink:#212124; --ink-deep:#0A0A0D; --t1:#1F141A; --t2:#736166; --t3:#A69499;
  --glow:#F58FA8; --soft:#FFF0F0; --sage:#85C299; --water:#66B8EB; --rose:#E09485;
  --border:#E6E6EB; --track:#EBEBF0; --line-avg:#C2456A; --dot-day:#E8A07A;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--t1);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:var(--t1)}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 104px)}
.rounded{font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif}

/* header */
.top{display:flex;justify-content:space-between;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(245,143,168,.3);font-size:14px;font-weight:600;box-shadow:0 4px 10px rgba(245,143,168,.15)}
.pill svg{color:var(--glow)}
.ring{width:38px;height:38px;position:relative;display:grid;place-items:center;font-size:10px;font-weight:700}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.hero{text-align:center;margin:18px 0 6px}
.hero .lbl{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3)}
.hero .num{font-size:58px;font-weight:800;color:var(--ink);line-height:1.05}
.hero .sub{font-size:13px;color:var(--t2)}
.week{display:flex;justify-content:space-between;margin:16px 0 18px;gap:4px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px 0}
.wd span{font-size:11px;font-weight:600;color:var(--t3)}
.wd b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;border:1.5px solid var(--track);color:var(--t2)}
.wd.done b{background:var(--ink);border-color:var(--ink);color:#fff}
.wd.sel b{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--glow)}
.wd.fut b{opacity:.45}

.sheet{background:#fff;border-radius:30px 30px 0 0;margin:0 -20px;padding:6px 20px 0;box-shadow:0 -10px 24px rgba(245,143,168,.16)}
.label{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin:22px 4px 10px}
.h1{font-size:28px;font-weight:800;margin:8px 0 2px;letter-spacing:-.3px}
.lead{color:var(--t2);font-size:14px;margin:0 0 6px}

/* cards */
.card{background:#fff;border:1px solid var(--border);border-radius:22px;overflow:hidden}
.stack>*+*{margin-top:12px}
.pad{padding:16px}
.habit{display:flex;min-height:84px;width:100%;text-align:left;background:none;border:0;padding:0}
.slab{width:72px;flex:none;background:var(--ink);display:grid;place-items:center;color:#fff}
.slab.soft{background:var(--soft);color:var(--ink)}
.hb{flex:1;display:flex;align-items:center;gap:12px;padding:12px 14px;min-width:0}
.hb .tx{flex:1;min-width:0}
.tt{font-size:16px;font-weight:700}
.st{font-size:13px;color:var(--t2);margin-top:2px}
.check{width:44px;height:44px;flex:none;border-radius:13px;border:1.5px solid var(--border);background:#fff;display:grid;place-items:center;color:transparent}
.check.on{background:var(--ink);border-color:var(--ink);color:#fff}
.drop{border-top:1px solid var(--border);padding:14px 16px}
.bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:14px;font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.field{height:44px;border-radius:14px;border:1px solid var(--border);padding:0 12px;background:#fff;min-width:0;flex:1;font-size:16px}
.field.sm{flex:none;width:76px;text-align:center}
.btn{display:block;width:100%;height:56px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:17px;font-weight:700;margin-top:18px}
.btn.done{background:var(--sage)}
.btn.sec{height:50px;font-size:15px;background:#fff;color:var(--ink);border:1px solid var(--border);margin-top:12px}
.btn.small{height:44px;font-size:15px;margin-top:12px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:#B4506C;letter-spacing:.2px}
.tag.g{background:#E7F3EA;color:#3E7A50}
.muted{color:var(--t3);font-size:13px}
.list-row{display:flex;align-items:center;gap:10px;padding:12px 16px}
.list-row+.list-row{border-top:1px solid var(--border)}
.list-row .tx{flex:1;min-width:0}
.x{width:32px;height:32px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--t3);display:grid;place-items:center;flex:none}
.plus{width:36px;height:36px;border-radius:12px;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.prose{font-size:14px;color:var(--t1)}
.prose p{margin:0 0 10px}
.prose ul{margin:0 0 10px;padding-left:18px}
.prose li{margin-bottom:6px}
.prose b{font-weight:700}
.prose h4{font-size:15px;margin:14px 0 6px}

/* segmented */
.seg{display:flex;background:var(--track);border-radius:999px;padding:4px;margin:14px 0 4px}
.seg button{flex:1;height:36px;border-radius:999px;border:0;background:none;font-size:13px;font-weight:600;color:var(--t2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}

/* macro */
.macro{display:flex;gap:16px;align-items:center}
.bigring{width:112px;height:112px;position:relative;flex:none;display:grid;place-items:center;text-align:center}
.bigring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.bigring b{font-size:24px;font-weight:800;display:block;line-height:1}
.bigring small{font-size:11px;color:var(--t2)}
.mx{flex:1}
.mx .m+.m{margin-top:10px}
.mx .m div:first-child{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.mx .m span{color:var(--t2);font-weight:500}

/* sets */
.ex{padding:16px}
.ex .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sets{margin-top:12px;display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.sets .n{font-size:13px;font-weight:700;color:var(--t3);text-align:center}
.sets .field{width:100%;text-align:center}
.sets .check{width:44px;height:44px}
.cue{font-size:13px;color:var(--t2);margin-top:8px}

/* overlay */
.overlay{position:fixed;inset:0;background:#fff;z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch}
.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:#fff;display:grid;place-items:center}

/* chart */
.chart{position:relative;margin-top:8px}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 10px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.08);white-space:nowrap;transform:translate(-50%,-100%)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--t2);margin-top:6px}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stat3>div{padding:14px 6px}
.stat3>div+div{border-left:1px solid var(--border)}
.stat3 b{display:block;font-size:20px;font-weight:800}
.stat3 small{font-size:11px;color:var(--t2)}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:0;padding:0;background:var(--track)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .tag{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.9)}
.ph.picked{box-shadow:inset 0 0 0 3px var(--glow)}
label.btn{display:flex;align-items:center;justify-content:center;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;display:block}
.cmp .tt{font-size:14px;margin-top:8px}
.photo-full{width:100%;border-radius:22px;margin-top:16px;display:block}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{flex:1;max-width:96px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--t3);padding:4px 0}
.tabs button.on{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:40}
</style>
</head>

const KEY = 'sculpt.v1';
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
const today = () => keyOf(new Date());
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');

function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
let S = load() || { start: today(), days: {}, weights: [], measures: [], last: null };
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function day(k) { return S.days[k] || (S.days[k] = { h: {}, steps: 0, water: 0, food: [], sets: {}, workout: null, session: null, done: false }); }

/* ---------- photos (IndexedDB, too big for localStorage) ---------- */
const PH = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('sculpt-photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('photos', mode), req = fn(t.objectStore('photos'));
      t.oncomplete = () => res(req.result); t.onerror = () => rej(t.error);
    });
  };
  return { all: () => tx('readonly', s => s.getAll()), put: p => tx('readwrite', s => s.put(p)), del: id => tx('readwrite', s => s.delete(id)), clear: () => tx('readwrite', s => s.clear()) };
})();
let PHOTOS = [], URLS = {};
function shrink(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('decode')); };
    img.src = u;
  });
}
async function addPhotos(files) {
  if (!files.length) return;
  toast('Saving…');
  try { navigator.storage?.persist?.(); } catch {}
  let ok = 0;
  for (const f of files) {
    try {
      const blob = await shrink(f);
      const p = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), d: today(), pose: ui.pose, blob };
      await PH.put(p);
      URLS[p.id] = URL.createObjectURL(blob); PHOTOS.push(p); ok++;
    } catch { toast('Couldn\'t save that photo. Try a JPG or PNG.'); }
  }
  if (ok) toast(ok > 1 ? `${ok} photos saved` : 'Photo saved');
  render();
}

/* ---------- derived ---------- */
const sessionById = id => id === 'R' ? REST : SESSIONS.find(s => s.id === id);
function nextSession() {
  const i = ROTATION.indexOf(S.last);
  return ROTATION[(i + 1) % ROTATION.length];
}
function plannedSession(k) { const d = day(k); return d.workout || d.session || nextSession(); }
const sum = (arr, f) => arr.reduce((a, x) => a + (x[f] || 0), 0);

function habitDone(k, h) {
  const d = S.days[k]; if (!d) return false;
  if (h === 'workout') return !!d.workout;
  if (d.h[h]) return true;
  if (h === 'steps') return d.steps >= TARGET.steps;
  if (h === 'protein') return sum(d.food, 'p') >= TARGET.p;
  if (h === 'water') return d.water >= TARGET.water;
  return false;
}
const pct = k => HABITS.filter(h => habitDone(k, h.k)).length / HABITS.length;
function streak() {
  let k = today(), n = 0;
  if (!S.days[k]?.done) k = addDays(k, -1);
  while (S.days[k]?.done) { n++; k = addDays(k, -1); }
  return n;
}
function lastBest(name, beforeKey) {
  const id = slug(name);
  const keys = Object.keys(S.days).filter(k => k < beforeKey).sort().reverse();
  for (const k of keys) {
    const sets = S.days[k].sets?.[id];
    if (sets && sets.some(s => s.d && (s.w || s.r))) {
      const done = sets.filter(s => s.d);
      return done.map(s => `${s.w || '–'}×${s.r || '–'}`).join(', ');
    }
  }
  return null;
}
function weekAvg(endKey) {
  const from = addDays(endKey, -6);
  const w = S.weights.filter(x => x.d >= from && x.d <= endKey);
  return w.length ? w.reduce((a, x) => a + x.lb, 0) / w.length : null;
}

}

    </div></div>
    <div class="label">Logged</div>
    <div class="card">${f.length ? f.map((x, i) => `<div class="list-row"><div class="tx"><div style="font-size:14px;font-weight:600">${esc(x.n)}</div><div class="st">${x.k} kcal · ${x.p}g P · ${x.c || 0}g C · ${x.f || 0}g F</div></div><button class="x" data-act="rm-food" data-i="${i}" aria-label="remove">${I(ICON.x, 14, 2.2)}</button></div>`).join('') : '<div class="list-row muted">Nothing logged yet — tap + below.</div>'}</div>

    <p class="muted" style="margin:10px 4px">Values are estimates. Weigh pasta/rice dry and meat raw for the most accuracy.</p>`;
}

/* ---------- PROGRESS ---------- */

  const toGoal = avg != null ? avg - TARGET.goal : null;
  const M = [...S.measures].sort((a, b) => a.d < b.d ? 1 : -1);
  return `<div class="h1">Progress</div><p class="lead">Trust the 7-day average, not one morning.</p>
    <div class="card" style="margin-top:14px"><div class="stat3">
      <div><b class="rounded">${avg != null ? avg.toFixed(1) : '—'}</b><small>7-day avg (lb)</small></div>
      <div><b class="rounded">${delta != null ? (delta > 0 ? '+' : '') + delta.toFixed(1) : '—'}</b><small>vs last week</small></div>
      <div><b class="rounded">${toGoal != null ? Math.max(0, toGoal).toFixed(1) : '—'}</b><small>lb to ${TARGET.goal}</small></div>
    </div></div>
    <div class="label">Weigh-in</div>
    <div class="card pad"><div class="row"><input class="field" id="wt" inputmode="decimal" placeholder="Morning weight (lb)"><button class="plus" data-act="add-weight" aria-label="add">${I(ICON.plus, 18, 2.4)}</button></div>
      <div class="muted" style="margin-top:8px">Morning, after the bathroom, before food. Expect ±2–3 lb swings — and higher during your period week.</div></div>

      <div class="legend"><span><i style="width:8px;height:8px;border-radius:50%;background:var(--dot-day)"></i>Daily</span><span><i style="width:16px;height:2px;background:var(--line-avg)"></i>7-day avg</span><span><i style="width:16px;border-top:2px dashed var(--t3)"></i>Goal</span></div>` : '<div class="muted">Log at least two weigh-ins to see your trend.</div>'}</div>
    ${W.length ? `<div class="label">History</div><div class="card">${[...W].reverse().slice(0, 14).map(x => `<div class="list-row"><div class="tx"><div style="font-size:14px;font-weight:600">${x.lb.toFixed(1)} lb</div><div class="st">${fmtDate(x.d)} · avg ${weekAvg(x.d).toFixed(1)}</div></div><button class="x" data-act="rm-weight" data-k="${x.d}" aria-label="remove">${I(ICON.x, 14, 2.2)}</button></div>`).join('')}</div>` : ''}
    ${renderPhotos()}

      <div class="muted" style="margin-top:8px">Waist at the navel, hips at the widest part of the glutes, thigh 6" above the knee. Hips steady or up + waist & thigh down = it's working.</div></div>
    ${M.length ? `<div class="card" style="margin-top:12px">${M.map(x => `<div class="list-row"><div class="tx"><div style="font-size:14px;font-weight:600">W ${x.w || '–'} · H ${x.h || '–'} · T ${x.t || '–'}</div><div class="st">${fmtDate(x.d)}</div></div><button class="x" data-act="rm-measure" data-k="${x.d}" aria-label="remove">${I(ICON.x, 14, 2.2)}</button></div>`).join('')}</div>` : ''}

const avgNote = k => { const a = weekAvg(k); return a != null ? `7-day avg ${a.toFixed(1)} lb` : ''; };

function renderCompare(ids) {

function drawChart() {
  const el = document.getElementById('chart'); if (!el) return;
  const W = [...S.weights].sort((a, b) => a.d < b.d ? -1 : 1);
  const pts = W.map(x => ({ d: x.d, lb: x.lb, avg: weekAvg(x.d), t: dateOf(x.d).getTime() }));
  const w = el.clientWidth, h = 190, L = 34, R = 8, T = 10, B = 22;
  const vals = pts.flatMap(p => [p.lb, p.avg]).concat(TARGET.goal);
  let lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t || t0 + 1;
  const X = t => L + (t1 === t0 ? 0.5 : (t - t0) / (t1 - t0)) * (w - L - R);
  const Y = v => T + (hi - v) / (hi - lo) * (h - T - B);
  const step = Math.max(1, Math.ceil((hi - lo) / 4));
  let grid = '';
  for (let v = lo; v <= hi; v += step) grid += `<line x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--track)" stroke-width="1"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10" fill="var(--t3)">${v}</text>`;
  const fd = k => dateOf(k).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const xl = `<text x="${L}" y="${h - 4}" font-size="10" fill="var(--t3)">${fd(pts[0].d)}</text><text x="${w - R}" y="${h - 4}" font-size="10" fill="var(--t3)" text-anchor="end">${fd(pts[pts.length - 1].d)}</text>`;
  const goal = `<line x1="${L}" x2="${w - R}" y1="${Y(TARGET.goal)}" y2="${Y(TARGET.goal)}" stroke="var(--t3)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${w - R}" y="${Y(TARGET.goal) - 5}" text-anchor="end" font-size="10" fill="var(--t2)">Goal ${TARGET.goal}</text>`;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.avg).toFixed(1)}`).join('');
  const dots = pts.map(p => `<circle cx="${X(p.t)}" cy="${Y(p.lb)}" r="4" fill="var(--dot-day)" stroke="#fff" stroke-width="2"/>`).join('');
  const lastP = pts[pts.length - 1];
  el.innerHTML = `<svg height="${h}" viewBox="0 0 ${w} ${h}">${grid}${goal}${xl}${dots}<path d="${line}" fill="none" stroke="var(--line-avg)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="${X(lastP.t) - 6}" y="${Y(lastP.avg) - 9}" text-anchor="end" font-size="11" font-weight="700" fill="var(--t1)">${lastP.avg.toFixed(1)}</text>
    <line id="xh" y1="${T}" y2="${h - B}" stroke="var(--t3)" stroke-width="1" visibility="hidden"/><rect x="${L}" y="0" width="${w - L - R}" height="${h}" fill="transparent" id="hit"/></svg><div class="tip" id="tip" hidden></div>`;
  const hit = el.querySelector('#hit'), xh = el.querySelector('#xh'), tip = el.querySelector('#tip');
  const move = ev => {
    const r = el.getBoundingClientRect(), x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    let best = pts[0]; for (const p of pts) if (Math.abs(X(p.t) - x) < Math.abs(X(best.t) - x)) best = p;
    const px = X(best.t);
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.style.left = Math.min(Math.max(px, 60), w - 60) + 'px'; tip.style.top = (Math.min(Y(best.lb), Y(best.avg)) - 8) + 'px';
    tip.innerHTML = `<b>${fd(best.d)}</b><br>Weigh-in ${best.lb.toFixed(1)} lb<br>7-day avg ${best.avg.toFixed(1)} lb`;
  };
  const leave = () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); };
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move); hit.addEventListener('pointerleave', leave);
}

/* ---------- PLAN ---------- */
function renderPlan() {
  return `<div class="h1">Plan</div><p class="lead">24 · 5'5" · lifting 5+ years · goal: lean, defined, glute-focused</p>
  <div class="label">Your goal weight</div>
  <div class="card pad prose"><p><b>Goal: 125 lb first.</b> At 5'5", 125 lb puts you around 20–22% body fat with your training history — visibly lean, defined back, flat core, and full glutes.</p>
    <p>115 lb is still a healthy weight for your height, but getting there would almost certainly cost muscle you've spent 5 years building — and the glutes are usually the first to go flat. Muscle is what creates the shape you want.</p>
    <p style="margin:0">Once you're at 125, judge by photos and measurements, not the scale. If you want more definition then, a short muscle-building phase usually looks better than dieting further.</p></div>
  <div class="label">Daily targets</div>
  <div class="card"><div class="stat3"><div><b class="rounded">1,800</b><small>kcal</small></div><div><b class="rounded">125g</b><small>protein</small></div><div><b class="rounded">12k</b><small>steps</small></div></div></div>
  <div class="card pad prose" style="margin-top:12px"><ul style="margin:0"><li><b>Pace:</b> 0.5–0.75 lb/week → about 14–20 weeks to 125 (roughly Feb–Mar 2027).</li><li><b>Macros:</b> ~125g protein · ~170g carbs · ~60g fat. Put most carbs around training.</li><li><b>Adjust:</b> if your 7-day average hasn't dropped in 2 weeks (outside your period week), cut 100–150 kcal or add 2k steps — not both.</li><li><b>Steps:</b> 10k is the floor, 12k the target, 15k challenge days 2–3×/week.</li><li><b>Sleep:</b> 7.5–9h. Poor sleep raises hunger and water retention.</li></ul></div>
  <div class="label">Food changes</div>
  <div class="card pad prose"><p>Your base is already good — real food, red meat, eggs, dairy, butter/ghee. The main problem is <b>protein is too low</b> for two meals a day, and fats are unmeasured.</p><ul>
    <li><b>Eat 3 meals + 1 snack.</b> 125g protein is hard to hit in 2 meals.</li>
    <li><b>Measure butter/ghee.</b> 1 tsp (34 kcal) to cook. Free-poured, it's usually 2–3 tbsp (200–300 kcal) without noticing.</li>
    <li><b>Use 90/10 or 93/7 ground beef</b> instead of 80/20 — same red meat, ~100 kcal less per serving.</li>
    <li><b>Swap vanilla yogurt + protein bar → plain whole-milk or 2% Greek yogurt + berries + a little honey.</b> More protein, less added sugar, no processed bar.</li>
    <li><b>Weigh carbs:</b> 70g dry GF pasta, ~150g cooked rice, ~200g sweet potato per meal.</li>
    <li><b>Add vegetables to 2 meals/day</b> and avocado a few times a week — fiber keeps you full.</li>
    <li><b>Honey:</b> keep it to 1–2 tsp a day.</li>
    <li><b>Treats:</b> plan one per week (e.g. Saturday pizza) and log it. Planned isn't failing.</li>
    <li><b>Optional:</b> salmon, sardines and trout are among the lowest-mercury fish. Twice a week would replace an omega-3 supplement. Beef liver once a week is very nutrient-dense if you like it.</li></ul>
    <h4>Sample day (~1,800 kcal · ~126g protein)</h4><ul style="margin:0">
    <li>Breakfast: cappuccino + 3 eggs with 30g mozzarella in 1 tsp butter</li>
    <li>Lunch: 70g GF pasta + 150g 90/10 beef + peppers, 1 tsp butter</li>
    <li>Snack: 200g plain Greek yogurt + berries + 1 tsp honey</li>
    <li>Dinner: purple sweet potato mash + 150g 90/10 beef + 20g mozzarella</li></ul></div>
  <div class="label">Supplements</div>
  <div class="card pad prose"><h4 style="margin-top:0">Take</h4><ul>
    <li><b>Creatine monohydrate — 3–5g daily.</b> The most researched supplement for strength and muscle, and it helps you keep muscle while losing fat. Pick plain, unflavored (single ingredient). You may gain 1–2 lb of water <i>inside the muscle</i> the first weeks — that's not fat.</li>
    <li><b>Magnesium glycinate — 200–300mg before bed.</b> Sleep, recovery and cramps. Your diet is low in nuts, seeds and leafy greens, its main food sources.</li>
    <li><b>Omega-3 (fish oil) — 1–2g EPA+DHA</b>, only if you're not eating fatty fish. Choose a third-party-tested brand (IFOS); purified oils are tested for mercury.</li>

    <h4>Skip for now</h4><ul style="margin:0">

    <li><b>Multivitamin</b> — not needed with this way of eating.</li></ul></div>
  <p class="muted" style="margin:12px 4px">General guidance, not medical advice — check new supplements with your doctor, and re-do bloodwork every 6–12 months.</p>

}

/* ---------- render ---------- */
const TABS = [['today', 'Today', 'today'], ['train', 'Train', 'dumbbell'], ['eat', 'Eat', 'fork'], ['progress', 'Progress', 'chart'], ['plan', 'Plan', 'book']];

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, d = day(ui.sel);
  if (a !== 'exp') e.stopPropagation();
  switch (a) {
    case 'tab': ui.tab = b.dataset.id; ui.overlay = null; window.scrollTo(0, 0); break;
    case 'sel': ui.sel = b.dataset.k; ui.exp = null; break;
    case 'exp': if (e.target.closest('.check')) return; ui.exp = ui.exp === b.dataset.k ? null : b.dataset.k; break;
    case 'toggle': {
      const k = b.dataset.k;
      if (k === 'workout') { ui.overlay = { type: 'session', id: plannedSession(ui.sel) }; break; }
      if (k === 'core' || k === 'stretch') { d.h[k] = !d.h[k]; break; }
      d.h[k] = !habitDone(ui.sel, k);
      break;
    }
    case 'pick': d.session = b.dataset.id; if (d.workout) d.workout = null; break;
    case 'open-session': ui.overlay = { type: 'session', id: b.dataset.id }; break;
    case 'open-routine': ui.overlay = { type: 'routine', id: b.dataset.id }; break;
    case 'close': ui.overlay = null; break;
    case 'steps+': d.steps = (d.steps || 0) + +b.dataset.n; break;
    case 'water': d.water = Math.max(0, (d.water || 0) + +b.dataset.n); break;
    case 'set-done': {
      const arr = d.sets[b.dataset.e] || (d.sets[b.dataset.e] = []);
      const s = arr[+b.dataset.i] || (arr[+b.dataset.i] = {});
      s.d = !s.d; break;
    }
    case 'finish': {
      const id = b.dataset.id;
      if (d.workout === id) { d.workout = null; }
      else { d.workout = id; d.session = id; if (id !== 'R' && ui.sel === today()) S.last = id; toast('Session saved 💪'); ui.overlay = null; }
      break;
    }
    case 'routine-done': d.h[b.dataset.id] = !d.h[b.dataset.id]; if (d.h[b.dataset.id]) { ui.overlay = null; toast('Nice — done'); } break;
    case 'complete': d.done = !d.done; if (d.done) toast(pct(ui.sel) === 1 ? 'Perfect day ✨' : 'Day logged'); break;
    case 'seg': ui.trainSeg = b.dataset.id; break;
    case 'group': ui.eatGroup = b.dataset.id; break;
    case 'add-food': { const f = FOODS[+b.dataset.i]; d.food.push({ n: f.n, k: f.k, p: f.p, c: f.c, f: f.f }); toast('Added'); break; }
    case 'rm-food': d.food.splice(+b.dataset.i, 1); break;
    case 'add-custom': {
      const n = document.getElementById('cf-n').value.trim(), k = +document.getElementById('cf-k').value || 0, p = +document.getElementById('cf-p').value || 0;
      if (!n) return toast('Name the food'); d.food.push({ n, k, p, c: 0, f: 0 }); toast('Added'); break;
    }
    case 'add-weight': {
      const v = parseFloat(document.getElementById('wt').value);
      if (!(v > 60 && v < 400)) return toast('Enter your weight in lb');
      S.weights = S.weights.filter(x => x.d !== today()); S.weights.push({ d: today(), lb: v }); toast('Weigh-in saved'); break;
    }
    case 'rm-weight': S.weights = S.weights.filter(x => x.d !== b.dataset.k); break;
    case 'add-measure': {
      const g = id => parseFloat(document.getElementById(id).value) || null;
      const m = { d: today(), w: g('m-w'), h: g('m-h'), t: g('m-t') };
      if (!m.w && !m.h && !m.t) return toast('Enter at least one');
      S.measures = S.measures.filter(x => x.d !== today()); S.measures.push(m); toast('Saved'); break;
    }
    case 'rm-measure': S.measures = S.measures.filter(x => x.d !== b.dataset.k); break;
    case 'pose': ui.pose = b.dataset.id; break;
    case 'cmp': ui.cmp = ui.cmp ? null : []; break;
    case 'photo': {
      const id = b.dataset.id;
      if (!ui.cmp) { ui.overlay = { type: 'photo', id }; break; }
      ui.cmp = ui.cmp.includes(id) ? ui.cmp.filter(x => x !== id) : [...ui.cmp, id];
      if (ui.cmp.length === 2) { ui.overlay = { type: 'compare', ids: ui.cmp }; ui.cmp = null; }
      break;
    }
    case 'del-photo': {
      if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = 'Tap again to delete'; return; }
      const id = b.dataset.id;
      PH.del(id).then(() => {
        URL.revokeObjectURL(URLS[id]); delete URLS[id];
        PHOTOS = PHOTOS.filter(x => x.id !== id); ui.overlay = null; toast('Photo deleted'); render();
      }).catch(() => toast('Couldn\'t delete that photo'));
      return;
    }
    case 'reset':
      if (b.dataset.armed) {
        S = { start: today(), days: {}, weights: [], measures: [], last: null };
        PH.clear().catch(() => {}); Object.values(URLS).forEach(u => URL.revokeObjectURL(u)); PHOTOS = []; URLS = {};
        toast('Reset');
      }
      else { b.dataset.armed = 1; b.textContent = 'Tap again to erase everything'; return; }
      break;
  }
  save(); render();
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'ph-in') { addPhotos([...t.files]); t.value = ''; return; }
  const which = t.dataset.in; if (!which) return;
  const d = day(ui.sel);
  if (which === 'steps') { d.steps = Math.max(0, parseInt(t.value) || 0); save(); render(); return; }
  if (which === 'w' || which === 'r') {
    const arr = d.sets[t.dataset.e] || (d.sets[t.dataset.e] = []);
    const s = arr[+t.dataset.i] || (arr[+t.dataset.i] = {});
    s[which] = t.value.trim() === '' ? null : parseFloat(t.value);
    if (s.w != null || s.r != null) s.d = s.d ?? false;
    save();
  }
});

let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => ui.tab === 'progress' && drawChart(), 150); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && ui.sel < today() && !ui.overlay) { ui.sel = today(); render(); } });
render();
PH.all().then(arr => {
  PHOTOS = arr; arr.forEach(p => URLS[p.id] = URL.createObjectURL(p.blob));
  if (arr.length) render();
}).catch(() => {});
</script>
</body>
</html>
